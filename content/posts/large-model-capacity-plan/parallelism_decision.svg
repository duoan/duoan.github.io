   <g id="text_1">
    <text style="font-size: 9px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #1f2933" transform="translate(233.728734 54.464841)">Does static state fit one GPU</text>
    <text style="font-size: 9px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #1f2933" transform="translate(239.225062 63.984028)">with activation headroom?</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #1f2933" transform="translate(68.093337 135.498028)">Yes → DP (+ ZeRO)</text>
    <text style="font-size: 9px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #1f2933" transform="translate(75.465603 145.122684)">scale throughput</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #1f2933" transform="translate(444.838741 135.427294)">No → raise TP</text>
    <text style="font-size: 9px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #1f2933" transform="translate(432.256319 145.078106)">(NVLink domain first)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #1f2933" transform="translate(436.755616 214.825041)">Still OOM on acts?</text>
    <text style="font-size: 9px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #1f2933" transform="translate(448.663038 224.344228)">SP / CP next</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #1f2933" x="291.501" y="284.454356" transform="rotate(-0 291.501 284.454356)">Only then PP — bubbles are a tax, not a flex</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #1f2933" transform="translate(80.466228 279.69195)">Long context?</text>
    <text style="font-size: 9px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #1f2933" transform="translate(67.294587 289.316606)">add SP/CP even if fit</text>
   </g>
   <g id="text_7">
    <text style="font-size: 13px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #1f2933" x="291.501" y="16.663594" transform="rotate(-0 291.501 16.663594)">Parallelism is forced by fit, then by fabric</text>
   </g>
  </g>
