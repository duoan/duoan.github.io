<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">MoE token-expert pipeline</title>
  <desc id="desc">Router through top-k, permute, All-to-All, grouped GEMM, activation, combine.</desc>
  <defs>
    <marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="300" fill="#f8fafc"/>
  <text x="32" y="36" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">MoE is a pipeline -- speeding only expert GEMM often makes communication louder</text>

  <g transform="translate(24,70)">
    <rect width="100" height="70" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="18" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Router</text>
    <text x="18" y="50" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#64748b">T x E logits</text>
  </g>
  <path fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#m)" d="M130 105 H150"/>

  <g transform="translate(156,70)">
    <rect width="100" height="70" rx="8" fill="#ffedd5" stroke="#fb923c" stroke-width="1.5"/>
    <text x="22" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Top-k</text>
    <text x="14" y="50" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#64748b">+ histogram</text>
  </g>
  <path fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#m)" d="M262 105 H282"/>

  <g transform="translate(288,70)">
    <rect width="100" height="70" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="16" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Permute</text>
    <text x="18" y="50" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#64748b">gather / CSR</text>
  </g>
  <path fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#m)" d="M394 105 H414"/>

  <g transform="translate(420,70)">
    <rect width="100" height="70" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="20" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">A2A</text>
    <text x="12" y="50" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#64748b">dispatch</text>
  </g>
  <path fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#m)" d="M526 105 H546"/>

  <g transform="translate(552,70)">
    <rect width="110" height="70" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
    <text x="10" y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Grouped</text>
    <text x="18" y="46" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">GEMM-1</text>
    <text x="22" y="62" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#64748b">gate+up</text>
  </g>
  <path fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#m)" d="M668 105 H688"/>

  <g transform="translate(694,70)">
    <rect width="100" height="70" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="14" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Act fuse</text>
    <text x="18" y="50" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#64748b">SiLU x up</text>
  </g>
  <path fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#m)" d="M800 105 H820"/>

  <g transform="translate(826,70)">
    <rect width="110" height="70" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
    <text x="10" y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Grouped</text>
    <text x="18" y="46" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">GEMM-2</text>
    <text x="20" y="62" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#64748b">+ combine</text>
  </g>

  <g transform="translate(420,180)">
    <rect width="100" height="70" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="18" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">A2A</text>
    <text x="18" y="50" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#64748b">combine</text>
  </g>
  <path fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#m)" d="M470 145 V175"/>

  <text x="32" y="250" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#64748b">Critical path metric: exposed All-to-All time, not "did NCCL overlap on a stream?"</text>
  <text x="32" y="272" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#64748b">Better: chunk by dest/rank -&gt; enqueue expert tiles as tokens arrive -&gt; send output tiles as soon as ready</text>
</svg>
