<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">MoE tokenexpert pipeline</title>
  <desc id="desc">Router through top-k, permute, All-to-All, grouped GEMM, activation, combine.</desc>
  <defs>
    <style>
      .h { font: 700 18px "IBM Plex Sans", "Segoe UI", sans-serif; fill: #0f172a; }
      .b { font: 700 12px "IBM Plex Sans", "Segoe UI", sans-serif; fill: #0f172a; }
      .n { font: 600 11px "IBM Plex Sans", "Segoe UI", sans-serif; fill: #64748b; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#m); }
    </style>
    <marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="300" fill="#f8fafc"/>
  <text x="32" y="36" class="h">MoE is a pipeline  speeding only expert GEMM often makes communication louder</text>

  <g transform="translate(24,70)">
    <rect width="100" height="70" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="18" y="32" class="b">Router</text>
    <text x="18" y="50" class="n">T×E logits</text>
  </g>
  <path class="arrow" d="M130 105 H150"/>

  <g transform="translate(156,70)">
    <rect width="100" height="70" rx="8" fill="#ffedd5" stroke="#fb923c" stroke-width="1.5"/>
    <text x="22" y="32" class="b">Top-k</text>
    <text x="14" y="50" class="n">+ histogram</text>
  </g>
  <path class="arrow" d="M262 105 H282"/>

  <g transform="translate(288,70)">
    <rect width="100" height="70" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="16" y="32" class="b">Permute</text>
    <text x="18" y="50" class="n">gather / CSR</text>
  </g>
  <path class="arrow" d="M394 105 H414"/>

  <g transform="translate(420,70)">
    <rect width="100" height="70" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="20" y="32" class="b">A2A</text>
    <text x="12" y="50" class="n">dispatch</text>
  </g>
  <path class="arrow" d="M526 105 H546"/>

  <g transform="translate(552,70)">
    <rect width="110" height="70" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
    <text x="10" y="28" class="b">Grouped</text>
    <text x="18" y="46" class="b">GEMM-1</text>
    <text x="22" y="62" class="n">gate+up</text>
  </g>
  <path class="arrow" d="M668 105 H688"/>

  <g transform="translate(694,70)">
    <rect width="100" height="70" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="14" y="32" class="b">Act fuse</text>
    <text x="18" y="50" class="n">SiLU×up</text>
  </g>
  <path class="arrow" d="M800 105 H820"/>

  <g transform="translate(826,70)">
    <rect width="110" height="70" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
    <text x="10" y="28" class="b">Grouped</text>
    <text x="18" y="46" class="b">GEMM-2</text>
    <text x="20" y="62" class="n">+ combine</text>
  </g>

  <g transform="translate(420,180)">
    <rect width="100" height="70" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="18" y="32" class="b">A2A</text>
    <text x="18" y="50" class="n">combine</text>
  </g>
  <path class="arrow" d="M470 145 V175"/>

  <text x="32" y="250" class="n">Critical path metric: exposed All-to-All time, not did NCCL overlap on a stream?</text>
  <text x="32" y="272" class="n">Better: chunk by dest/rank ’ enqueue expert tiles as tokens arrive ’ send output tiles as soon as ready</text>
</svg>
