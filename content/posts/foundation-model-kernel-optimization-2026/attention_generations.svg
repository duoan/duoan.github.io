<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="340" viewBox="0 0 920 340" role="img" aria-labelledby="title desc">
  <title id="title">FlashAttention generations</title>
  <desc id="desc">FA1 IO-aware tiling through FA4 Blackwell asymmetric co-design.</desc>
  <rect width="920" height="340" fill="#f8fafc"/>
  <text x="36" y="36" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Attention optimization migrated with the hardware bottleneck</text>

  <rect x="36" y="60" width="200" height="240" rx="12" fill="#fff1f2" stroke="#fb7185" stroke-width="2"/>
  <text x="54" y="95" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">FA-1 / IO</text>
  <text x="54" y="125" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#475569">Materialized S x S</text>
  <text x="54" y="145" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#475569">scores dominate HBM</text>
  <text x="54" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#475569">Tiled Q/K/V +</text>
  <text x="54" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#475569">online softmax</text>
  <text x="54" y="235" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#475569">Never write the</text>
  <text x="54" y="255" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#475569">full attention matrix</text>

  <rect x="252" y="60" width="200" height="240" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="270" y="95" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">FA-2 / Partition</text>
  <text x="270" y="125" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#475569">Non-matmul FLOPs,</text>
  <text x="270" y="145" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#475569">parallelism, warps</text>
  <text x="270" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#475569">Fewer rescales;</text>
  <text x="270" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#475569">better work split</text>
  <text x="270" y="235" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#475569">A100 utilization</text>
  <text x="270" y="255" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#475569">pushed to 50-73%</text>

  <rect x="468" y="60" width="200" height="240" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="486" y="95" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">FA-3 / Hopper</text>
  <text x="486" y="125" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#475569">Async HW underused:</text>
  <text x="486" y="145" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#475569">TMA + WGMMA</text>
  <text x="486" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#475569">Warp specialization;</text>
  <text x="486" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#475569">matmul / softmax</text>
  <text x="486" y="235" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#475569">Pipeline data,</text>
  <text x="486" y="255" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#475569">MMA, and SFU</text>

  <rect x="684" y="60" width="200" height="240" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text x="702" y="95" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">FA-4 / Blackwell</text>
  <text x="702" y="125" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#475569">TC faster than</text>
  <text x="702" y="145" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#475569">SFU / SMEM / TMEM</text>
  <text x="702" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#475569">Async MMA, 2-CTA,</text>
  <text x="702" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#475569">software exp path</text>
  <text x="702" y="235" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#475569">Not a port of FA-3 --</text>
  <text x="702" y="255" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#475569">rebalance the ratios</text>
</svg>
